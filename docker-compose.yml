name: pharmacy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pharmacy} -d ${POSTGRES_DB:-pharmacy}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ./backend
      args:
        CMD: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      args:
        CMD: api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_TIMEOUT: ${DB_TIMEOUT:-3s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      PRICE_JUMP_RATIO: ${PRICE_JUMP_RATIO:-0.70}
      OFFER_STALE_AFTER: ${OFFER_STALE_AFTER:-24h}
      OFFER_CRITICAL_AFTER: ${OFFER_CRITICAL_AFTER:-72h}
      CRAWL_TIMEOUT: ${CRAWL_TIMEOUT:-15s}
      OTP_PEPPER: ${OTP_PEPPER:-dev-only-otp-pepper}
      OTP_PRINT_CODE: ${OTP_PRINT_CODE:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"
        tag: "{{.Name}}"

  worker:
    build:
      context: ./backend
      args:
        CMD: worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
      DB_TIMEOUT: ${DB_TIMEOUT:-3s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      PRICE_JUMP_RATIO: ${PRICE_JUMP_RATIO:-0.70}
      OFFER_STALE_AFTER: ${OFFER_STALE_AFTER:-24h}
      OFFER_CRITICAL_AFTER: ${OFFER_CRITICAL_AFTER:-72h}
      CRAWL_TIMEOUT: ${CRAWL_TIMEOUT:-15s}
      OTP_PEPPER: ${OTP_PEPPER:-dev-only-otp-pepper}
      OTP_PRINT_CODE: ${OTP_PRINT_CODE:-true}
      WORKER_HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"
        tag: "{{.Name}}"

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"
        tag: "{{.Name}}"

  caddy:
    image: caddy:2-alpine
    profiles: ["launch"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - worker

  opsuser:
    build:
      context: ./backend
      args:
        CMD: opsuser
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable}
      OPS_USERNAME: ${OPS_USERNAME:-ops}
      OPS_PASSWORD: ${OPS_PASSWORD:-ops-dev-password}
      OPS_ROLE: ${OPS_ROLE:-data_ops}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["ops"]

  seedmatches:
    build:
      context: ./backend
      args:
        CMD: seedmatches
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["ops"]

  seedbulk:
    build:
      context: ./backend
      args:
        CMD: seedbulk
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pharmacy}?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["seed"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
